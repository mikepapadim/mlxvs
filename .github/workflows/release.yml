name: Release

# Wheels for every supported Python on Apple silicon and the sdist. A v* tag
# publishes them to PyPI (trusted publishing: no token; the PyPI project must
# list this repository and workflow); a manual run only builds them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheel (Python ${{ matrix.python }})
    runs-on: macos-15
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # as MLX's own wheels: the oldest macOS MLX supports
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # the extension is arm64 only (MLX's Metal backend); without these the
      # python.org interpreters tag the wheel universal2
      _PYTHON_HOST_PLATFORM: macosx-14.0-arm64
      ARCHFLAGS: -arch arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: python -m pip wheel . --no-deps -w dist
      - name: Test the wheel
        run: |
          python -m pip install dist/*.whl numpy pytest
          cd python/tests && python -m pytest -q .
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*.whl

  sdist:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
