name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ (macOS 15, Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MLX
        run: brew install mlx cmake
      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH=/opt/homebrew
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        # Metal's API and shader validation: bounds checks on every buffer access, threadgroup memory limits
        env:
          MTL_DEBUG_LAYER: 1
          MTL_SHADER_VALIDATION: 1
        run: ctest --test-dir build --output-on-failure
      - name: Format
        run: |
          brew install clang-format
          clang-format --dry-run --Werror include/mlxvs/*.h src/*.cpp src/*.h tests/*.cpp tests/*.h bench/*.cpp python/*.cpp

  python:
    name: Python (macOS 15, Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .
      - name: Test
        run: |
          python -m pip install pytest hnswlib
          python -m pytest -q python/tests
      - name: README example
        # the Python example of README.md's "Use" section, as written
        run: |
          python - <<'PY'
          import re
          blocks = re.findall(r"```python\n(.*?)```", open("README.md").read(), re.S)
          code = next(b for b in blocks if b.startswith("import numpy"))
          exec(compile(code, "README.md", "exec"))
          PY
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check python bench examples
          ruff format --check python bench examples
