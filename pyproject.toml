[build-system]
requires = [
  "setuptools>=80",
  "cmake>=3.25",
  "mlx>=0.32.0,<0.33",
  "nanobind==3.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "mlxvs"
version = "0.10.0"
description = "GPU k-NN search and k-NN graph construction on Apple silicon, built on MLX"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "mikepapadim" }]
requires-python = ">=3.10"
# MLX has no stable C++ ABI: the extension is built against one MLX release
dependencies = ["mlx>=0.32.0,<0.33", "numpy>=1.24"]
keywords = [
  "nearest-neighbors", "knn", "knn-graph", "nn-descent", "vector-search",
  "k-means", "gpu", "metal", "apple-silicon", "mlx", "cuvs", "umap",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
  "Environment :: GPU",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/mikepapadim/mlxvs"
Issues = "https://github.com/mikepapadim/mlxvs/issues"

[tool.setuptools]
packages = ["mlxvs"]
package-dir = { "" = "python" }
zip-safe = false

[tool.ruff]
line-length = 88
